<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RÖST – Website Template</title>
<style>
:root{--bg:#faf7f0;--bg2:#f1ece1;--ink:#2b2b2b;--mute:#6b6760;--line:#ddd6c8;--brand:#8a6f55;--brand-ink:#fff;--accent2:#b9a58f;--r:4px;--hf:Georgia,"Times New Roman",serif;--bf:system-ui,-apple-system,"Segoe UI",sans-serif;--s1:8px;--s2:16px;--s3:24px;--s4:48px;--s5:96px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-brand=b]{--bg:#fff;--bg2:#f3f5f8;--ink:#1c2230;--mute:#5d6676;--line:#dde2ea;--brand:#24407a;--accent2:#8fa3c7;--r:6px;--hf:system-ui,-apple-system,"Segoe UI",sans-serif;--bf:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--bf);overflow-x:hidden}
h1,h2,h3{font-family:var(--hf);font-weight:500;line-height:1.2;margin:0 0 var(--s2)}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.5rem,3vw,2.2rem)}h3{font-size:1.2rem}
p{margin:0 0 var(--s2);color:var(--mute)}a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 20px}.sec{padding:56px 0}.alt{background:var(--bg2)}
@media(min-width:768px){.sec{padding:96px 0}}
.eye{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:12px;display:block}
.btn{display:inline-block;padding:13px 24px;min-height:44px;border-radius:var(--r);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);text-decoration:none;font:inherit;font-size:.95rem;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}.btn.s{background:transparent;color:var(--brand)}.btn.sm{padding:9px 18px;min-height:40px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .w{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--hf);font-size:1.3rem;text-decoration:none;letter-spacing:.04em}
nav.m{display:none;gap:28px;align-items:center}nav.m a{text-decoration:none;font-size:.95rem;color:var(--mute)}nav.m a:hover,nav.m a.on{color:var(--ink)}nav.m a.btn,nav.m a.btn:hover{color:var(--brand-ink)}
.burger{background:none;border:1px solid var(--line);border-radius:var(--r);width:44px;height:44px;font-size:1.2rem;cursor:pointer;color:var(--ink)}
.drawer{display:none;border-top:1px solid var(--line);padding:12px 20px 20px}.drawer.open{display:block}.drawer a{display:block;padding:12px 0;text-decoration:none;border-bottom:1px solid var(--line)}
@media(min-width:900px){nav.m{display:flex}.burger,.drawer{display:none!important}}
.g2{display:grid;gap:32px;align-items:center}.g3{display:grid;gap:24px}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr;gap:64px}.g3{grid-template-columns:repeat(3,1fr)}.g2.rev>:first-child{order:2}}
.img{background:var(--bg2);border:1px dashed var(--accent2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.8rem;text-align:center;padding:12px}
.alt .img{background:var(--bg)}.r43{aspect-ratio:4/3}.r11{aspect-ratio:1}.r45{aspect-ratio:4/5}.r169{aspect-ratio:16/9}
.card{border-top:1px solid var(--line);padding-top:20px}.card .n{font-family:var(--hf);color:var(--brand);font-size:.9rem}
.price{font-family:var(--hf);color:var(--ink);font-size:1.1rem}
.quote{border-left:2px solid var(--brand);padding-left:20px;font-family:var(--hf);font-size:1.1rem;color:var(--ink)}
.quote small{display:block;font:.85rem var(--bf);color:var(--mute);margin-top:8px}
.cta{text-align:center;max-width:640px;margin:0 auto}.cta .row{justify-content:center}
footer{border-top:1px solid var(--line);padding:48px 0 32px;background:var(--bg2)}
footer .g3{grid-template-columns:1fr}@media(min-width:768px){footer .g3{grid-template-columns:2fr 1fr 1fr}}
footer a{display:block;color:var(--mute);text-decoration:none;padding:4px 0}footer a:hover{color:var(--ink)}
.small{font-size:.8rem;color:var(--mute);margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
label{display:block;font-size:.85rem;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.f{margin-bottom:16px}.fg{display:grid;gap:0 16px}@media(min-width:600px){.fg{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--mute)}.chk input{width:20px;min-height:20px;margin-top:3px}
.ph{border:1px dashed var(--brand);border-radius:var(--r);padding:20px;text-align:center;font-size:.85rem;color:var(--mute);background:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}.cal b{font-weight:400;color:var(--mute);font-size:.7rem}
.cal span{padding:10px 0;border-radius:var(--r);border:1px solid transparent}.cal .a{border-color:var(--line);cursor:pointer}.cal .sel{background:var(--brand);color:var(--brand-ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.slots span{border:1px solid var(--line);text-align:center;padding:10px 0;border-radius:var(--r);font-size:.85rem}.slots .sel{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--bg)}
.sum{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.ok{width:56px;height:56px;border-radius:50%;border:1px solid var(--brand);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:20px}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-family:var(--hf);font-size:1.1rem}
.hide{display:none}.sw{display:inline-block;width:56px;height:56px;border-radius:var(--r);border:1px solid var(--line)}
.dev{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px;font-size:.75rem;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.dev button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:6px 10px;cursor:pointer;font:inherit;min-height:32px}.dev button.on{background:var(--bg);color:var(--ink)}
.dev select{width:auto;min-height:32px;padding:4px;background:var(--bg)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
</style></head><body>
<div id="app"></div>
<div class="dev" aria-label="Prototype controls"><span style="align-self:center">Customer:</span><button data-b="a" class="on">A · Ivory</button><button data-b="b">B · Navy</button><span style="align-self:center;margin-left:6px">|</span><button data-l="en" class="on">EN</button><button data-l="sv">SV</button><select id="nav" aria-label="Jump to screen"></select></div>
<script>
var BR={a:{name:"Halden & Voss",tag:"Considered guidance for everyday work",heading:"Clear thinking for confident decisions",short:"Halden & Voss",email:"hello@haldenvoss.example",phone:"+00 000 000 000",loc:"Placeholder Street 1, City"},
b:{name:"NORDLIGHT Studio",tag:"Practical support for growing practices",heading:"Calm, structured support you can rely on",short:"NORDLIGHT",email:"info@nordlight.example",phone:"+00 111 111 111",loc:"Sample Avenue 12, Town"}};
var V=[["home","Home"],["about","About"],["offerings","Offerings"],["contact","Contact"],["page","Flexible page"],["product","Product detail + cart"],["checkout","Checkout"],["thanks","Purchase thank-you"],["booking","Booking"],["sent","Contact confirmation"],["privacy","Privacy Policy"],["terms","Terms & Conditions"],["system","Design system & guide"]];
var brand="a";
function im(r,t){return '<div class="img '+r+'">'+(t||'Replace image')+'</div>'}
function btn(t,h,s){return '<a class="btn'+(s?' s':'')+'" href="#'+h+'">'+t+'</a>'}
function svc(i,t,d,l){return '<div class="card"><span class="n">0'+i+'</span><h3>'+t+'</h3><p>'+d+'</p><a href="#'+l+'">Learn more →</a></div>'}
function prod(t,d,p){return '<div>'+im('r11','Product image')+'<h3 style="margin-top:16px">'+t+'</h3><p>'+d+'</p><div class="row" style="align-items:center;justify-content:space-between"><span class="price">'+p+'</span>'+btn('View details','product',1).replace('class="btn s"','class="btn s sm"')+'</div></div>'}
function quote(t,n){return '<div class="quote">“'+t+'”<small>'+n+'</small></div>'}
function cta(h,p,a,b){return '<section class="sec alt"><div class="w cta"><h2>'+h+'</h2><p>'+p+'</p><div class="row">'+a+b+'</div></div></section>'}
function head(t,p,e){return '<section class="sec"><div class="w" style="max-width:760px"><span class="eye">'+(e||'')+'</span><h1>'+t+'</h1><p style="font-size:1.1rem">'+p+'</p></div></section>'}
function form(){return '<form onsubmit="location.hash=\'sent\';return false"><div class="fg"><div class="f"><label for="n">Name</label><input id="n" required></div><div class="f"><label for="e">Email</label><input id="e" type="email" required></div></div><div class="fg"><div class="f"><label for="p">Phone (optional)</label><input id="p" type="tel"></div><div class="f"><label for="s">Enquiry type</label><select id="s"><option>General question</option><option>Service enquiry</option><option>Product question</option></select></div></div><div class="f"><label for="m">Message</label><textarea id="m" rows="5"></textarea></div><div class="f chk"><input type="checkbox" id="c" required><label for="c" style="margin:0">I agree to the processing of my details as described in the <a href="#privacy">Privacy Policy</a>.</label></div><button class="btn">Send message</button><p style="font-size:.8rem;margin-top:12px">[Placeholder – no email is sent in this design]</p></form>'}
function cal(){var d='';for(var i=1;i<=28;i++)d+='<span class="'+(i==9||i==16?'sel':(i%3?'a':''))+'">'+i+'</span>';return '<div class="box"><div class="cal"><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b><b>S</b>'+d+'</div><div class="slots"><span>09:00</span><span class="sel">10:30</span><span>13:00</span><span>14:30</span><span>16:00</span><span>17:00</span></div><div class="ph" style="margin-top:16px">[Placeholder: HighLevel calendar embed]</div></div>'}
function sumBox(){return '<div class="box"><h3>Order summary</h3><div class="sum"><span>Sample product × 1</span><span>€48.00</span></div><div class="sum"><span>Shipping</span><span>€5.00</span></div><div class="sum"><b>Total</b><b>€53.00</b></div></div>'}
function legal(t){return head(t,'[Placeholder – customer to supply their own legal content]','Legal')+'<section class="sec alt"><div class="w" style="max-width:760px"><div class="box"><h3>Section heading</h3><p>[Editable text area. Paste your own '+t+' text here. This template does not provide legal content.]</p><h3>Section heading</h3><p>[Editable text area.]</p></div></div></section>'}
function main(v,B){switch(v){
case"home":return '<section class="sec"><div class="w g2"><div><span class="eye">'+B.tag+'</span><h1>'+B.heading+'</h1><p style="font-size:1.1rem">A short supporting line about who you help and how. Replace with your own words.</p><div class="row">'+btn('Book a conversation','booking')+btn('View offerings','offerings',1)+'</div></div>'+im('r45','Hero image 4:5')+'</div></section>'+
'<section class="sec alt"><div class="w g2">'+im('r43','Intro image 4:3')+'<div><span class="eye">Introduction</span><h2>A few words about '+B.short+'</h2><p>Brief business introduction. Keep it warm, specific and short.</p><a href="#about">Read our story →</a></div></div></section>'+
'<section class="sec"><div class="w"><span class="eye">Offerings</span><h2>How we can help</h2><div class="g3" style="margin-top:32px">'+svc(1,'Service one','Short description of the first offer.','page')+svc(2,'Service two','Short description of the second offer.','page')+svc(3,'Service three','Short description of the third offer.','offerings')+'</div></div></section>'+
'<section class="sec alt"><div class="w g2 rev">'+im('r169','Featured image 16:9')+'<div><span class="eye">Featured</span><h2>Featured offer or announcement</h2><p>Flexible block for a product, service, event or special offer.</p>'+btn('Find out more','page')+'</div></div></section>'+
'<section class="sec"><div class="w"><span class="eye">Kind words</span><div class="g3" style="margin-top:16px">'+quote('Placeholder testimonial in one or two sentences.','Client name, role')+quote('A second short piece of customer feedback.','Client name, role')+quote('A third, brief recommendation.','Client name, role')+'</div></div></section>'+cta('Ready when you are','Book a time or send an enquiry.',btn('Book now','booking'),btn('Contact us','contact',1));
case"about":return head('About '+B.short,'A short, approachable introduction to the business.','About')+'<section class="sec alt"><div class="w g2">'+im('r43')+'<div><h2>Our story</h2><p>Background and story. Two or three short paragraphs.</p></div></div></section><section class="sec"><div class="w"><h2>What guides us</h2><div class="g3" style="margin-top:24px">'+svc(1,'Value one','One sentence.','about')+svc(2,'Value two','One sentence.','about')+svc(3,'Value three','One sentence.','about')+'</div></div></section><section class="sec alt"><div class="w"><span class="eye">Layout option 1 · Founder / team</span><div class="g3" style="margin-top:16px">'+[1,2,3].map(function(i){return '<div>'+im('r45','Portrait')+'<h3 style="margin-top:12px">Name Surname</h3><p>Role</p></div>'}).join('')+'</div></div></section><section class="sec"><div class="w" style="max-width:760px"><span class="eye">Layout option 2 · No portraits</span><div class="box"><h3>The people behind '+B.short+'</h3><p>Text-only alternative: a single column with a pull quote, or one wide image with caption. Use when there is no team photography.</p>'+quote('A short statement from the founder.','Founder name')+'</div></div></section>'+cta('See how we can work together','','<a class="btn" href="#offerings">Offerings</a>','<a class="btn s" href="#contact">Contact</a>');
case"offerings":return head('Offerings','Services and products in one flexible page.','Offerings')+'<section class="sec alt"><div class="w"><h2>Services</h2><div class="g3" style="margin-top:24px">'+svc(1,'Service one','Description, duration, outcome.','page')+svc(2,'Service two','Description, duration, outcome.','page')+svc(3,'Service three','Description, duration, outcome.','page')+'</div><div style="margin-top:32px">'+btn('Book or enquire','booking')+'</div></div></section><section class="sec"><div class="w"><span class="eye">Shop</span><h2>Products</h2><div class="g3" style="margin-top:24px">'+prod('Sample product one','Short description.','€48.00')+prod('Sample product two','Short description.','€36.00')+prod('Sample product three','Short description.','€24.00')+'</div></div></section>'+cta('Not sure what fits?','Tell us what you need and we’ll point you in the right direction.',btn('Enquire','contact'),'');
case"contact":return head('Get in touch','We usually reply within [x] working days.','Contact')+'<section class="sec alt"><div class="w g2" style="align-items:start"><div class="box">'+form()+'</div><div><h3>Contact details</h3><p>'+B.email+'<br>'+B.phone+'<br>'+B.loc+'</p><p>Instagram · LinkedIn · Facebook</p><div class="box" style="margin-top:32px"><h3>Prefer to book?</h3><p>Choose a time that suits you.</p>'+btn('Go to booking','booking')+'</div></div></div></section>';
case"page":return head('Flexible content page','Modular blocks: rearrange, remove or duplicate.','Module · Page header')+'<section class="sec alt"><div class="w g2">'+im('r43')+'<div><span class="eye">Module · Image + text</span><h2>Offering details</h2><p>Detailed description of one service, product or announcement.</p>'+btn('Book','booking')+'</div></div></section><section class="sec"><div class="w" style="max-width:760px"><span class="eye">Module · FAQ</span><h2>Frequently asked questions</h2><details open><summary>Question one?</summary><p>Answer.</p></details><details><summary>Question two?</summary><p>Answer.</p></details><details><summary>Question three?</summary><p>Answer.</p></details></div></section>'+cta('Module · CTA','',btn('Contact','contact'),'');
case"product":return '<section class="sec"><div class="w g2" style="align-items:start"><div>'+im('r11','Main product image')+'<div class="row" style="margin-top:12px;flex-wrap:nowrap">'+[1,2,3].map(function(){return '<div style="flex:1">'+im('r11','Thumb')+'</div>'}).join('')+'</div></div><div><span class="eye">Shop</span><h1>Sample product one</h1><p class="price" style="font-size:1.4rem">€48.00</p><p>Product description. Materials, use, delivery.</p><div class="f"><label for="o">Option</label><select id="o"><option>Variation A</option><option>Variation B</option></select></div><div class="f" style="max-width:140px"><label for="q">Quantity</label><input id="q" type="number" value="1" min="1"></div>'+btn('Add to cart','checkout')+'</div></div></section><section class="sec alt"><div class="w" style="max-width:640px"><h2>Cart</h2><div class="box"><div class="sum"><span>Sample product one × 1</span><span>€48.00</span></div><div class="sum"><b>Subtotal</b><b>€48.00</b></div><div style="margin-top:16px">'+btn('Checkout','checkout')+'</div></div></div></section>';
case"checkout":return head('Checkout','','Checkout')+'<section class="sec alt"><div class="w g2" style="align-items:start"><div class="box"><h3>Customer details</h3><div class="fg"><div class="f"><label for="a1">Name</label><input id="a1"></div><div class="f"><label for="a2">Email</label><input id="a2" type="email"></div></div><h3>Billing address</h3><div class="f"><input aria-label="Address" placeholder="Address"></div><div class="fg"><div class="f"><input aria-label="Postcode" placeholder="Postcode"></div><div class="f"><input aria-label="City" placeholder="City"></div></div><h3>Payment</h3><div class="ph">[Placeholder: payment gateway – not connected]</div><div class="f chk" style="margin-top:16px"><input type="checkbox" id="tc"><label for="tc" style="margin:0">I accept the <a href="#terms">Terms & Conditions</a>.</label></div>'+btn('Place order','thanks')+'</div>'+sumBox()+'</div></section>';
case"thanks":return '<section class="sec"><div class="w g2" style="align-items:start"><div><div class="ok">✓</div><h1>Thank you for your order</h1><p>[Placeholder – a confirmation would be sent by email.]</p><h3>What happens next</h3><p>1. We prepare your order. 2. You receive delivery details. 3. Contact us if anything is unclear: '+B.email+'</p>'+btn('Back to website','home')+'</div>'+sumBox()+'</div></section>';
case"booking":return head('Book an appointment','Choose a service, pick a date and time.','Booking')+'<section class="sec alt"><div class="w g2" style="align-items:start"><div><h3>Booking information</h3><p>Duration, location or online, cancellation notes.</p><div class="f"><label for="sv">Service</label><select id="sv"><option>Service one · 60 min</option><option>Service two · 45 min</option></select></div><div class="ph">[Placeholder: HighLevel calendar integration]</div></div><div>'+cal()+'<div style="margin-top:16px">'+btn('Confirm booking','sent')+'</div></div></div></section>';
case"sent":return '<section class="sec"><div class="w" style="max-width:640px"><div class="ok">✓</div><h1>Thank you, we’ve received your message</h1><p>[Placeholder] We’ll read your enquiry and reply to the email you provided within [x] working days. No further action is needed.</p>'+btn('Back to home','home')+'</div></section>';
case"privacy":return legal('Privacy Policy');case"terms":return legal('Terms & Conditions');
case"system":return head('Design system & customer guide','All styling flows from CSS variables in :root. Switch customers with the control at the bottom.','System')+'<section class="sec alt"><div class="w"><h2>Tokens</h2><p>'+['--bg','--bg2','--ink','--brand','--accent2','--line'].map(function(t){return '<span title="'+t+'" class="sw" style="background:var('+t+')"></span> '}).join('')+'</p><div class="tbl"><table><tr><th>Token</th><th>Purpose</th></tr><tr><td>--brand, --accent2</td><td>Primary and secondary colour</td></tr><tr><td>--bg, --bg2</td><td>Page and section backgrounds</td></tr><tr><td>--hf, --bf</td><td>Heading and body typeface</td></tr><tr><td>--r</td><td>Corner radius</td></tr><tr><td>--s1…--s5</td><td>Spacing: 8, 16, 24, 48, 96px</td></tr></table></div><p style="margin-top:16px">Type scale: H1 32–54px, H2 24–35px, H3 19px, body 16px. Image ratios: 4:5, 4:3, 1:1, 16:9. Breakpoints: 390, 768, 1440.</p></div></section><section class="sec"><div class="w" style="max-width:760px"><h2>Customising for a new customer</h2><p>1. Replace logo text and business details. 2. Change the colour and font tokens. 3. Swap the image placeholders. 4. Edit headings and copy. 5. Remove or duplicate modules. Layout stays untouched.</p><p>Customer A: ivory, serif, earthy accent. Customer B: white, sans-serif, navy accent.</p><p><b>Not included:</b> payments, CRM, emails, live booking. All are labelled placeholders. Legal text is the customer’s responsibility.</p></div></section>'}}
